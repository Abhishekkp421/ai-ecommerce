{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | AI Shop</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        AI SHOP
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/cart/">
            Cart 🛒
        </a>

        <a href="/accounts/login/">
            Login
        </a>

    </div>

</nav>


<div class="auth-container">

    <div class="auth-box">

        <h1>Create Account</h1>

        <p>
            Join AI Shop today
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="/accounts/login/">
                Login
            </a>

        </p>

    </div>

</div>


<footer>

    <p>
        © 2026 AI Shop | AI-Powered E-Commerce
    </p>

</footer>

</body>

</html>
